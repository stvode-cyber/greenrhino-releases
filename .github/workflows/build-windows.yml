name: Build Windows EXE

# 推 tag（如 v1.2.3）即自动出包 Windows 单文件 exe，并作为 artifact / release 资产上传。
# 用法：git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Copy web + pack zip
        shell: bash
        run: |
          node clients/copy-web.mjs
          python clients/zip-wwwroot.py

      - name: Publish self-contained single-file exe
        shell: bash
        run: |
          dotnet publish clients/windows/GreenRhino/GreenRhino.csproj \
            -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreenRhino-windows
          path: publish/GreenRhino.exe

      - name: Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/GreenRhino.exe
