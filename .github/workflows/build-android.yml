name: Build Android (.aab)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# 构建两个独立的 Android TWA（绿角犀音乐 + 绿角犀播放器）
# 各自指向不同的 Cloudflare Pages PWA，使用各自的 namespace / applicationId
jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: music
            gradle: clients/android-music
            app_name: GreenRhinoMusic
            artifact: android-music-release
          - role: player
            gradle: clients/android-player
            app_name: GreenRhinoPlayer
            artifact: android-player-release
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Android icons + assetlinks
        working-directory: clients
        run: |
          npm i
          npx playwright install --with-deps chromium
          node build-assets.mjs
        # NOTE: No PWA build step here. TWA launches from Cloudflare Pages URL at
        # runtime (see strings.xml app_url). APK only ships browser shell, no web code.

      - name: Decode upload keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ${{ matrix.gradle }}/app
          echo "$KS_B64" | base64 -d > ${{ matrix.gradle }}/app/upload-keystore.jks
          ls -la ${{ matrix.gradle }}/app/upload-keystore.jks

      - name: Write local.properties (signing)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          cat >> ${{ matrix.gradle }}/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Assemble release bundle
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: ${{ matrix.gradle }}
          arguments: assembleRelease bundleRelease

      - name: Upload apk + aab
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.gradle }}/app/build/outputs/apk/release/*.apk
            ${{ matrix.gradle }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
