name: Build Android (.aab)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      PWA_URL: ${{ secrets.ANDROID_PWA_URL || 'https://greenrhino.example.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install web asset deps
        working-directory: clients
        run: |
          npm i
          npx playwright install --with-deps chromium

      - name: Build assets + copy web
        working-directory: clients
        run: |
          node build-assets.mjs
          node copy-web.mjs

      - name: Set deployed PWA host in strings.xml
        run: |
          HOST=$(echo "$PWA_URL" | sed -E 's#https?://##; s#/.*##')
          sed -i "s/greenrhino.example.com/$HOST/g" clients/android/app/src/main/res/values/strings.xml

      - name: Decode upload keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > clients/android/app/upload-keystore.jks

      - name: Write local.properties (signing)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          cat >> clients/android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Assemble release bundle
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: clients/android
          arguments: assembleRelease

      - name: Upload aab
        uses: actions/upload-artifact@v4
        with:
          name: GreenRhino-Android
          path: clients/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
