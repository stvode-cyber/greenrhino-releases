name: Build iOS (.ipa)

# 双独立 App 的 iOS App Store 打包工作流：
#   - GreenRhinoMusic  → com.greenrhino.music  (绿角犀音乐, bundle)
#   - GreenRhinoPlayer → com.greenrhino.player (绿角犀播放器, bundle)
#
# 两个 App 在同一个 XcodeGen project.yml 里定义为两个 target/scheme，
# 顺序 archive + export，最终上传两份 .ipa。
# App 版本号从 scripts/build-web.mjs 的 APP_VERSION 读取并注入，
# 与 Web/Android/Windows 保持一致的版本基线。
#
# 前置 GitHub Secrets:
#   IOS_TEAM_ID            — Apple Developer Team ID (例如 ABC123DEF4)
#   IOS_CERT_P12_BASE64    — .p12 签名证书 base64
#   IOS_CERT_PASSWORD      — .p12 密码
#   IOS_PROVISIONING_BASE64 — .mobileprovision base64
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install web asset deps
        working-directory: clients
        run: |
          npm i
          npx playwright install chromium

      - name: Build dual PWA sites
        run: node scripts/build-web.mjs

      - name: Build assets + copy web into wwwroot
        working-directory: clients
        run: |
          node build-assets.mjs
          node copy-web.mjs

      - name: Inject APP_VERSION into project.yml
        shell: bash
        run: |
          # 从 build-web.mjs 读 APP_VERSION (格式 v16 -> 提取 16)
          APP_VER_RAW=$(grep -oP "const APP_VERSION = '\K[^']+" scripts/build-web.mjs | head -1)
          APP_VER_NUM=$(echo "$APP_VER_RAW" | sed 's/^v//')
          echo "APP_VERSION raw = $APP_VER_RAW, numeric = $APP_VER_NUM"

          # MARKETING_VERSION: 16 -> 16.0.0 (Apple 要求 X.Y.Z)
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: ${APP_VER_NUM}.0.0/" clients/ios/project.yml
          # CURRENT_PROJECT_VERSION -> 16 (整数 build number)
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: ${APP_VER_NUM}/" clients/ios/project.yml

          echo "--- project.yml versions after inject ---"
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" clients/ios/project.yml

      - name: Set DEVELOPMENT_TEAM in project.yml
        if: ${{ secrets.IOS_TEAM_ID != '' }}
        run: |
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"${{ secrets.IOS_TEAM_ID }}\"/" clients/ios/project.yml

      - name: Import signing certificate
        if: ${{ secrets.IOS_CERT_P12_BASE64 != '' }}
        env:
          CERT_PWD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          echo "${{ secrets.IOS_CERT_P12_BASE64 }}" | base64 -d > cert.p12
          security import cert.p12 -P "$CERT_PWD" -T /usr/bin/codesign
          security find-identity -v -p codesigning

      - name: Install provisioning profile
        if: ${{ secrets.IOS_PROVISIONING_BASE64 != '' }}
        run: |
          echo "${{ secrets.IOS_PROVISIONING_BASE64 }}" | base64 -d > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Generate Xcode project
        working-directory: clients/ios
        run: xcodegen generate

      - name: Archive (Music + Player)
        working-directory: clients/ios
        run: |
          set -e
          for spec in \
            "GreenRhinoMusic build/Music.xcarchive" \
            "GreenRhinoPlayer build/Player.xcarchive" ; do
            set -- $spec
            echo "=== Archiving $1 ==="
            xcodebuild -scheme "$1" -archivePath "$2" archive -configuration Release -allowProvisioningUpdates
          done

      - name: Export IPA
        working-directory: clients/ios
        run: |
          [ -f ExportOptions.plist ] || cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "build/Music.xcarchive" -exportPath "build/ipa-music" -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates
          xcodebuild -exportArchive -archivePath "build/Player.xcarchive" -exportPath "build/ipa-player" -exportOptionsPlist ExportOptions.plist -allowProvisioningUpdates

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GreenRhinoMusic-iOS
          path: clients/ios/build/ipa-music/*.ipa
          if-no-files-found: error

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GreenRhinoPlayer-iOS
          path: clients/ios/build/ipa-player/*.ipa
          if-no-files-found: error
