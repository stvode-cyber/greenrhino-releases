  <rect x="250" y="74" width="56" height="24" rx="12" fill="#2D6CDF"/>
  <text x="278" y="90" text-anchor="middle" font-size="12" fill="#ffffff">视频</text>

  <rect x="186" y="104" width="468" height="200" rx="10" fill="#2c2c2a"/>
