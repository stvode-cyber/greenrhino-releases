  <text x="44" y="149" font-size="12" fill="#444441">歌单</text>
  <rect x="32" y="168" width="126" height="30" rx="6" fill="#ffffff" stroke="#d0d8e2" stroke-width="0.5"/>
  <text x="44" y="187" font-size="12" fill="#444441">收藏</text>
  <rect x="32" y="206" width="126" height="30" rx="6" fill="#ffffff" stroke="#d0d8e2" stroke-width="0.5"/>
