<svg viewBox="0 0 680 500" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img">
  <title>播放器 UI 线框 · 音乐模式</title>
  <desc>展示侧边栏、主区（专辑图加歌词）与常驻底栏的整体布局。</desc>
  <text class="th" x="20" y="30" font-size="14" font-weight="500" fill="#1f2937">播放器 UI 线框 · 音乐模式</text>

  <rect x="20" y="52" width="640" height="400" rx="14" fill="#f7f9fc" stroke="#c9d3e0" stroke-width="1"/>
  <rect x="20" y="52" width="150" height="400" rx="14" fill="#eef2f7"/>
  <rect x="150" y="52" width="14" height="400" fill="#eef2f7"/>

  <text x="36" y="80" font-size="13" font-weight="500" fill="#444441">媒体库</text>
  <rect x="32" y="92" width="126" height="30" rx="6" fill="#d6e4fb"/>
  <text x="44" y="111" font-size="12" fill="#0C447C">媒体库</text>
  <rect x="32" y="130" width="126" height="30" rx="6" fill="#ffffff" stroke="#d0d8e2" stroke-width="0.5"/>
  <text x="44" y="149" font-size="12" fill="#444441">歌单</text>
  <rect x="32" y="168" width="126" height="30" rx="6" fill="#ffffff" stroke="#d0d8e2" stroke-width="0.5"/>
  <text x="44" y="187" font-size="12" fill="#444441">收藏</text>
  <rect x="32" y="206" width="126" height="30" rx="6" fill="#ffffff" stroke="#d0d8e2" stroke-width="0.5"/>
  <text x="44" y="225" font-size="12" fill="#444441">设置</text>

  <rect x="186" y="74" width="56" height="24" rx="12" fill="#2D6CDF"/>
  <text x="214" y="90" text-anchor="middle" font-size="12" fill="#ffffff">音乐</text>
  <rect x="250" y="74" width="56" height="24" rx="12" fill="#e3e8ee"/>
  <text x="278" y="90" text-anchor="middle" font-size="12" fill="#444441">视频</text>

  <rect x="190" y="112" width="120" height="120" rx="12" fill="#cfe0f7"/>
