  <rect x="330" y="112" width="150" height="10" rx="4" fill="#e3e8ee"/>
  <rect x="330" y="132" width="150" height="10" rx="4" fill="#e3e8ee"/>
  <rect x="330" y="152" width="150" height="10" rx="4" fill="#2D6CDF"/>
  <rect x="330" y="172" width="150" height="10" rx="4" fill="#e3e8ee"/>
  <rect x="330" y="192" width="150" height="10" rx="4" fill="#e3e8ee"/>
  <rect x="330" y="212" width="150" height="10" rx="4" fill="#e3e8ee"/>
  <text x="330" y="246" font-size="11" fill="#888780">歌词（当前句高亮）</text>

  <rect x="170" y="416" width="490" height="30" rx="6" fill="#e7edf5"/>
  <circle cx="196" cy="431" r="11" fill="#2D6CDF"/>
  <path d="M192 426 L192 436 L201 431 Z" fill="#ffffff"/>
  <rect x="216" y="428" width="280" height="6" rx="3" fill="#d0d8e2"/>
  <rect x="216" y="428" width="120" height="6" rx="3" fill="#2D6CDF"/>
  <rect x="508" y="424" width="40" height="14" rx="4" fill="#d0d8e2"/>
