<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0E1116" />
  <title>绿角犀播放器 · 离线媒体播放器</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <!-- 侧边栏 -->
    <aside id="sidebar">
      <div class="brand">
        <img src="./icons/icon.svg" alt="logo" class="brand-logo" />
        <span class="brand-name">绿角犀播放器</span>
        <span class="app-version" id="app-version"></span>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-view="home"><span class="ico">⌂</span>首页</button>
        <button class="nav-item" data-view="music"><span class="ico">🎵</span>音乐</button>
        <button class="nav-item" data-view="video"><span class="ico">🎞️</span>视频</button>
        <div class="nav-sep"></div>
        <button class="nav-item" data-view="recent"><span class="ico">🕒</span>最近播放</button>
        <button class="nav-item" data-view="stats"><span class="ico">📊</span>统计</button>
        <button class="nav-item" data-view="playlists"><span class="ico">📃</span>歌单</button>
        <button class="nav-item" data-view="favorites"><span class="ico">⭐</span>收藏</button>
        <button class="nav-item" data-view="cloud"><span class="ico">☁️</span>我的云盘</button>
        <button class="nav-item" data-view="settings"><span class="ico">⚙️</span>设置</button>
        <button class="nav-item" data-action="help"><span class="ico">❓</span>使用说明</button>
      </nav>
      <div class="sidebar-foot">
        <button id="install-btn" class="ghost-btn accent" hidden>📲 安装应用</button>
        <button id="import-folder" class="ghost-btn">📁 导入文件夹</button>
        <button id="import-files" class="ghost-btn">＋ 添加文件</button>
      </div>
    </aside>

    <!-- 主区 -->
    <main id="main">
      <header id="topbar">
        <button id="menu-toggle" class="icon-btn" title="菜单">☰</button>
        <div class="search-box">
          <input id="search" type="search" placeholder="搜索音乐 / 视频…" autocomplete="off" />
        </div>
        <button id="import-folder-top" class="ghost-btn" title="导入文件夹">📁 导入</button>
      </header>
      <section id="view"><!-- 动态视图 --></section>
    </main>

    <!-- 常驻底栏（播放控制） -->
    <footer id="bottombar"><!-- 由 JS 构建 --></footer>

    <!-- 🎵 音乐 App 专属底部导航（hub/player role 隐藏） -->
    <nav id="music-nav" hidden>
      <button class="mn-item active" data-mn="discover">
        <span class="mn-ico">🏠</span><span class="mn-label">发现</span>
      </button>
      <button class="mn-item mn-center" data-mn="nowplaying" title="正在播放">
        <span class="mn-cover">🎵</span>
      </button>
      <button class="mn-item" data-mn="mine">
        <span class="mn-ico">👤</span><span class="mn-label">我的</span>
      </button>
    </nav>
  </div>

  <!-- 抽屉 / 引导 / 提示 容器 -->
  <div id="queue-drawer" class="drawer" hidden></div>
  <div id="modal-root"></div>
  <div id="toast-host"></div>

  <!-- 隐藏的媒体元素由播放引擎创建 -->
  <script type="module" src="./src/main.js?v=20261008131238"></script>
</body>
</html>
