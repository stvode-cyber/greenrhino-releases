# XcodeGen 工程定义 —— 运行 `xcodegen generate` 生成 GreenRhino.xcodeproj
# 安装：brew install xcodegen
# 说明：本项目包含两个完全独立的 App target：
#   - GreenRhinoMusic  (bundle id: com.greenrhino.music, 绿角犀音乐)
#   - GreenRhinoPlayer (bundle id: com.greenrhino.player, 绿角犀播放器)
name: GreenRhino
options:
  bundleIdPrefix: com.greenrhino
  deploymentTarget:
    iOS: "14.0"
targets:
  GreenRhinoMusic:
    type: application
    platform: iOS
    sources:
      - path: Music
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greenrhino.music
        INFOPLIST_FILE: Music/Info.plist
        VERSIONING_SYSTEM: apple-generic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEVELOPMENT_TEAM: ""     # 填入你的开发者 Team ID
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: 绿角犀音乐
        INFOPLIST_KEY_CFBundleName: 绿角犀音乐
  GreenRhinoPlayer:
    type: application
    platform: iOS
    sources:
      - path: Player
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greenrhino.player
        INFOPLIST_FILE: Player/Info.plist
        VERSIONING_SYSTEM: apple-generic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEVELOPMENT_TEAM: ""     # 填入你的开发者 Team ID
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: 绿角犀播放器
        INFOPLIST_KEY_CFBundleName: 绿角犀播放器
schemes:
  GreenRhinoMusic:
    build:
      targets:
        GreenRhinoMusic: all
    run:
      config: Release
  GreenRhinoPlayer:
    build:
      targets:
        GreenRhinoPlayer: all
    run:
      config: Release