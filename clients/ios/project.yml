# XcodeGen 工程定义 —— 运行 `xcodegen generate` 生成 GreenRhino.xcodeproj
# 安装：brew install xcodegen
name: GreenRhino
options:
  bundleIdPrefix: com.greenrhino
  deploymentTarget:
    iOS: "14.0"
targets:
  GreenRhino:
    type: application
    platform: iOS
    sources:
      - path: GreenRhino
      - path: GreenRhino/wwwroot
        buildPhase: resources
        resources:
          folder: reference     # 蓝色文件夹引用，保留 wwwroot 目录结构
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greenrhino.player
        INFOPLIST_FILE: GreenRhino/Info.plist
        VERSIONING_SYSTEM: apple-generic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEVELOPMENT_TEAM: ""     # 填入你的开发者 Team ID
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
