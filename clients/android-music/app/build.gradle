plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.greenrhino.music'
    compileSdk 34

    defaultConfig {
        applicationId "com.greenrhino.music"
        minSdk 21
        targetSdk 34
        versionCode 16
        versionName "v16"
    }

    signingConfigs {
        release {
            def localProps = new Properties()
            def localFile = rootProject.file('local.properties')
            if (localFile.exists()) {
                localFile.withInputStream { localProps.load(it) }
            }
            def ksPath = localProps.getProperty('storeFile', 'upload-keystore.jks')
            storeFile file(ksPath)
            storePassword localProps.getProperty('storePassword', '')
            keyAlias localProps.getProperty('keyAlias', 'upload')
            keyPassword localProps.getProperty('keyPassword', '')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release  // debug 也用 release keystore，保持 assetlinks 一致
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// === ISS-002 修复：禁用 Gradle copy UP-TO-DATE 检测 ===
// Gradle 默认比较 inputs/outputs 文件时间戳 → 改了 src/ 后忘了先跑 build-web.mjs 时，
// release/pwa-site-music/ 时间戳没变 → UP-TO-DATE → APK 里前端是旧代码
// 解法：outputs.upToDateWhen { false } 强制每次 preBuild 都执行复制
task copyPwaAssets(type: Copy) {
    outputs.upToDateWhen { false }
    def pwaDir = rootProject.file('../../release/pwa-site-music')
    def destDir = file("$rootDir/app/src/main/assets/pwa")

    // 如果 release 目录不存在，自动 build
    if (!pwaDir.exists()) {
        doLast {
            exec {
                workingDir rootProject.file('../..')
                commandLine 'node', 'scripts/build-web.mjs'
            }
        }
    }

    from pwaDir.exists() ? pwaDir : rootProject.file('../../release/pwa-site-music')
    into destDir
    exclude '.well-known/**'
}

preBuild.dependsOn copyPwaAssets

dependencies {
    // Kotlin
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // 媒体能力
    implementation 'androidx.media:media:1.7.0'

    // WebView
    implementation 'androidx.webkit:webkit:1.11.0'

    // Splash Screen API（Android 12+）
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
