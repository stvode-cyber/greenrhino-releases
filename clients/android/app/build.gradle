plugins {
    id 'com.android.application'
}

android {
    namespace 'com.greenrhino.player'
    compileSdk 34

    defaultConfig {
        applicationId "com.greenrhino.player"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def localProps = new Properties()
            def localFile = rootProject.file('local.properties')
            if (localFile.exists()) {
                localFile.withInputStream { localProps.load(it) }
            }
            def ksPath = localProps.getProperty('storeFile', 'upload-keystore.jks')
            storeFile file(ksPath)
            storePassword localProps.getProperty('storePassword', '')
            keyAlias localProps.getProperty('keyAlias', 'upload')
            keyPassword localProps.getProperty('keyPassword', '')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core:1.13.1'
}
