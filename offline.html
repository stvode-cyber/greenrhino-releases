<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>📴 离线 - 绿角犀</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif;
    background: var(--bg, #14141a); color: var(--text, #e6eaf0); text-align: center;
    padding: 32px; gap: 16px;
  }
  .ico { font-size: 72px; opacity: .8; }
  h1 { font-size: 22px; font-weight: 600; }
  p { color: var(--text-3, #78839a); font-size: 14px; line-height: 1.7; max-width: 320px; }
  .tip { background: var(--card-2, #1f222a); border: 1px solid var(--line, #2a2d36);
    border-radius: 10px; padding: 12px 18px; font-size: 13px; color: var(--text-2, #9aa3b2); }
</style>
</head>
<body>
  <div class="ico">📴</div>
  <h1>当前离线</h1>
  <p>网络不可用。不过你本地已导入的音乐/视频仍然可以播放。</p>
  <div class="tip">💡 连接网络后刷新页面即可恢复在线功能（云同步 / LRCLIB 歌词）</div>
</body>
</html>
